<!DOCTYPE html>
<html lang="en">
<head>
    <title>Xiangqi (Chinese Chess) Board</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords"
          content="xiangqi, 象棋, elephant chess, chinese chess, chess variant, xiangqi online, chinese chess online">
    <meta name="author" content="benckx">
    <meta name="description" content="A playable Xiangqi (Chinese Chess) board powered by board-gui.js and xiangqi.js.">
    <link rel="icon" type="image/png" href="../images/icons/encelade-icon-50px.png">
    <link rel="stylesheet" href="0.1.1/board.css">
    <link rel="stylesheet" href="demo.css">
    <script defer src="0.1.1/xiangqi.js"></script>
    <script defer src="0.1.1/board-gui.js"></script>
    <script defer src="demo.js"></script>
</head>
<body>
<div class="page">
    <h1><code>board-gui</code> library</h1>
    <p>
        This Chinese chess (Xiangqi) board widget is available as a library from
        <nobr><a href="https://elephantchess.io">https://elephantchess.io</a></nobr>
        .
    </p>
    <div class="board-wrapper">
        <div id="board-container" class="board-container"></div>
    </div>
    <div class="controls">
        <button id="btn-reset">Reset</button>
        <button id="btn-flip">Flip</button>
        <button id="btn-style">Pieces: Traditional</button>
    </div>
</div>
</body>
